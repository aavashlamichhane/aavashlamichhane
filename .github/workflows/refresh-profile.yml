name: Refresh profile stats

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'vendor/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/refresh-profile.yml'

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pinned render dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check privacy and rendering
        run: npm test
      - name: Build local artwork
        run: node scripts/build-assets.mjs
      - name: Refresh snapshot
        run: node scripts/update-stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
      - name: Render community components from anonymous aggregates
        run: npm run render
      - name: Save updated cards
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add assets/ README.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh public profile stats'
          git push origin "HEAD:$DEFAULT_BRANCH"
